<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page may not send data anywhere: no fetch, XHR, beacons or form posts. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>APP reporting tool</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --fg: #1d1d1b; --muted: #676760; --line: #e2e1dc;
    --accent: #3b4fa8; --accent-fg: #ffffff;
    --ok-bg: #e3f1e6; --ok-fg: #1d6b34;
    --warn-bg: #fbf0d9; --warn-fg: #7a5200;
    --risk-bg: #fbe4e2; --risk-fg: #a1261b;
    --map-bg: #ecebf5; --map-fg: #4a4675;
    --bau-bg: #ebebe8; --bau-fg: #4b4b46;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1f1f1d; --fg: #ecebe6; --muted: #a09f98; --line: #34332f;
      --accent: #8c9cf0; --accent-fg: #11131f;
      --ok-bg: #1d3524; --ok-fg: #8fd6a2;
      --warn-bg: #3a2f14; --warn-fg: #f1c86b;
      --risk-bg: #3d1d1a; --risk-fg: #f3a098;
      --map-bg: #2a2840; --map-fg: #beb9ef;
      --bau-bg: #2c2c29; --bau-fg: #c2c1ba;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; padding: 20px 0 12px; }
  .top h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  #folder-status { color: var(--muted); font-size: .9rem; }
  #tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
  #tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  #tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  h2 { font-size: 1.15rem; margin: 16px 0 8px; }
  h3 { font-size: 1rem; margin: 0; }
  h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  p { margin: 0 0 12px; }
  code { font-size: .88em; background: var(--bau-bg); padding: 1px 4px; border-radius: 3px; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .hot { color: var(--risk-fg); font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; }
  .quiet { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: var(--fg); }
  .link { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin: 16px 0; }
  .intro { max-width: 620px; }
  .msg { border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .msg.error { background: var(--risk-bg); color: var(--risk-fg); }
  .msg.info { background: var(--map-bg); color: var(--map-fg); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
  .bar .primary { margin-left: auto; }
  .bar.start .primary { margin-left: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 6px 12px; color: var(--muted); min-width: 36px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .pill, .chip { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .chip { font-weight: 500; background: var(--bau-bg); color: var(--bau-fg); }
  .ok { background: var(--ok-bg); color: var(--ok-fg); }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  .risk { background: var(--risk-bg); color: var(--risk-fg); }
  .map { background: var(--map-bg); color: var(--map-fg); }
  .bau { background: var(--bau-bg); color: var(--bau-fg); }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  table.grid { border-collapse: collapse; width: 100%; font-size: .9rem; }
  table.grid th, table.grid td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.grid thead th { font-size: .8rem; color: var(--muted); font-weight: 600; }
  table.grid tfoot th, table.grid tfoot td { border-bottom: 0; font-weight: 600; }
  table.grid tbody tr:last-child th, table.grid tbody tr:last-child td { border-bottom: 0; }
  table.grid.narrow { width: auto; }
  .num { text-align: right !important; font-variant-numeric: tabular-nums; }
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 16px; }
  .counts div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; }
  .counts .big { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .counts span:last-child { color: var(--muted); font-size: .85rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .card.flag-behind { border-left-color: var(--risk-fg); }
  .card.flag-soon { border-left-color: var(--warn-fg); }
  .card.flag-ok { border-left-color: var(--ok-fg); }
  .card header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: flex-start; }
  .card .id { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .desc { color: var(--muted); font-size: .9rem; margin: 6px 0 12px; }
  .facts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
  .facts p { margin: 0; font-size: .9rem; }
  .periods { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
  .periods li { padding: 1px 0; }
  .periods li.now { font-weight: 600; }
  .periods li.now::before { content: "● "; color: var(--accent); }
  .file input { font: inherit; }
  details { margin: 8px 0 12px; }
  select, input[type="text"], input[type="date"], textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  textarea { width: 100%; margin: 8px 0; font-family: ui-monospace, Consolas, monospace; font-size: .88rem; }
  .status-select { font-size: .8rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; }
  .facts.two { grid-template-columns: 1.4fr 1fr; margin-top: 14px; }
  .deliv, .notes, .tu { list-style: none; margin: 0; padding: 0; font-size: .9rem; }
  .deliv li { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 4px 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
  .deliv li:first-child { border-top: 0; }
  .deliv select { font-size: .8rem; padding: 1px 4px; }
  .is-done { opacity: .6; }
  .is-done .deliv-title { text-decoration: line-through; }
  .due-soon { color: var(--warn-fg); font-weight: 600; }
  .notes li { padding: 3px 0; }
  .tu li { padding: 3px 0; }
  .tu-block { background: var(--map-bg); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .tu-block h4 { color: var(--map-fg); }
  .record { margin: 14px 0 0; border-top: 1px solid var(--line); padding-top: 10px; }
  .record summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .9rem; }
  .record-form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-top: 10px; }
  .record-form label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: 2px; }
  .record-form label.grow { flex: 1 1 260px; }
  .record-form input[type="text"] { width: 100%; }
  .panel.tight { padding: 14px 18px; margin: 10px 0; }
  .panel.tight h3 { margin-bottom: 2px; }
  .preview-group { border-top: 1px solid var(--line); padding: 10px 0 4px; }
  .preview-group ul { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; }
  .preview-group li { margin: 3px 0; }
  .help summary { cursor: pointer; }
  pre.example { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: .82rem; white-space: pre-wrap; }
  button:disabled { opacity: .5; cursor: default; }
  .counts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 620px; }
  .gaps { margin: 6px 0 4px; padding-left: 18px; font-size: .88rem; }
  .gaps li { margin: 2px 0; }
  .help-notes { margin: 6px 0 0; }
  .help-notes summary { cursor: pointer; color: var(--accent); }
  .help-notes .notes { margin-top: 4px; }
  h3.section { margin: 24px 0 6px; }
  .nowrap { white-space: nowrap; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0 8px; }
  .tl { list-style: none; margin: 6px 0 0; padding: 0; font-size: .9rem; }
  .tl li { padding: 3px 0; }
  /* Target chips: filled = relates, outlined = partly, faint = doesn't relate. */
  .targets { display: inline-flex; gap: 2px; flex-wrap: nowrap; }
  .t { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; font-size: .68rem; font-weight: 700; font-variant-numeric: tabular-nums; box-sizing: border-box; }
  .t-y { background: var(--accent); color: var(--accent-fg); }
  .t-p { background: var(--map-bg); color: var(--accent); border: 1.5px solid var(--accent); }
  .t-n { color: var(--muted); border: 1px dashed var(--line); opacity: .7; }
  .legend { margin: 4px 0 8px; }
  .legend summary { cursor: pointer; }
  .legend summary .t { vertical-align: middle; margin: 0 2px 0 6px; }
  .legend-list { columns: 3 220px; margin: 6px 0 0; padding-left: 22px; }
  table.progress td { font-size: .88rem; }
  /* Reporting */
  .msg.nudge { background: var(--warn-bg); color: var(--warn-fg); }
  .lead-line { font-size: 1.02rem; margin-bottom: 4px; }
  .checklist { list-style: none; margin: 0 0 8px; padding: 0; }
  .checklist li { padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .checklist li:first-child { border-top: 0; }
  .tick { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 50%; font-size: .75rem; font-weight: 700; margin-right: 6px; }
  .tick.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .tick.todo { border: 1.5px solid var(--line); color: var(--muted); }
  .row-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: 8px; }
  .small-btn { font-size: .8rem; padding: 2px 8px; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .inline-form input[type="text"] { flex: 1 1 280px; min-width: 0; }
  .inline-form select { flex: 0 1 320px; min-width: 0; max-width: 100%; }
  .strand-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .strand-notes label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 600; }
  .strand-notes textarea { font-family: inherit; font-size: .9rem; margin: 0; }
  .fill-report { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  tr.is-done td { opacity: .55; }
  /* Diagrams: strokes and text follow the page colour, so they work in both themes. */
  .diagram { margin: 12px 0 24px; }
  .diagram svg { width: 100%; height: auto; display: block; color: var(--fg); }
  .diagram figcaption { color: var(--muted); font-size: .88rem; margin-top: 6px; max-width: 820px; }
  .dg-box { fill: var(--surface); stroke: currentColor; stroke-opacity: .45; stroke-width: 1.2; }
  .dg-outside .dg-box { stroke-dasharray: 4 3; }
  .dg-store .dg-box { fill: var(--map-bg); stroke: var(--accent); stroke-opacity: 1; stroke-width: 1.5; }
  .dg-hub { fill: none; stroke: var(--accent); stroke-width: 2; }
  .dg-boundary { fill: none; stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 6 4; stroke-width: 1.2; }
  .dg-boundary-label { font-size: 12px; fill: var(--muted); font-weight: 600; }
  .dg-title { font-size: 13px; font-weight: 700; fill: currentColor; }
  .dg-sub { font-size: 11.5px; fill: var(--muted); }
  .dg-label { font-size: 11px; fill: var(--muted); }
  .dg-line { stroke: currentColor; stroke-opacity: .6; stroke-width: 1.4; fill: none; }
  .dg-line.dg-accent { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; color: var(--accent); }
  .dg-line.dg-dashed { stroke-dasharray: 5 4; }
  .dg-band { fill: var(--warn-bg); }
  .dg-accent-fill { fill: var(--accent); }
  .dg-dot { fill: var(--surface); stroke: currentColor; stroke-width: 1.5; }
  .dg-dot-accent { fill: var(--accent); }
  .how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .how-grid ol { padding-left: 18px; margin: 6px 0 0; }
  .deliv.wide { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .deliv.wide li { grid-template-columns: auto 1fr 110px 110px auto; }
  @media (max-width: 720px) {
    .facts, .facts.two { grid-template-columns: 1fr; gap: 10px; }
    .deliv li, .deliv.wide li { grid-template-columns: auto 1fr; }
    .bar .primary { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>APP reporting tool</h1>
    <div id="folder-status"></div>
  </div>
  <nav id="tabs" role="tablist"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<script src="js/lib/jszip.min.js"></script>
<script src="js/xlsx-read.js"></script>
<script src="js/model.js"></script>
<script src="js/tracker-import.js"></script>
<script src="js/template-read.js"></script>
<script src="js/meeting-update.js"></script>
<script src="js/docx-write.js"></script>
<script src="js/reports.js"></script>
<script src="js/timeline-check.js"></script>
<script src="js/xlsx-write.js"></script>
<script src="js/papers.js"></script>
<script src="js/annual-data.js"></script>
<script src="js/reporting.js"></script>
<script src="js/folder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
